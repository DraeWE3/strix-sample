name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build studio
        run: npm run build:admin && npm run verify:admin
      - name: Build site (offline; full builds need Firestore and the VITE_* secrets)
        run: npm run build:offline
