name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build studio
        run: npm run build:admin && npm run verify:admin
      - name: Build site (offline; full builds need Firestore and the VITE_* secrets)
        run: npm run build:offline

  # Builds with the real config and uploads both apps to Hostinger. Secrets live in the
  # "production" environment (Settings → Environments); see "Deploying to Hostinger" in the README.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
      VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
      VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
      VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      VITE_SHOWREEL_YOUTUBE_ID: ${{ secrets.VITE_SHOWREEL_YOUTUBE_ID }}
      VITE_CALENDLY_URL: ${{ secrets.VITE_CALENDLY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build site
        run: npm run build && npm run verify:release
      - name: Build studio
        run: npm run build:admin && npm run verify:admin
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload to Hostinger
        run: bash scripts/deploy-hostinger.sh
        env:
          DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_USER }}
          DEPLOY_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          DEPLOY_PROTOCOL: ${{ vars.HOSTINGER_PROTOCOL || 'ftp' }}
          DEPLOY_PORT: ${{ vars.HOSTINGER_PORT }}
          DEPLOY_SITE_DIR: ${{ vars.HOSTINGER_SITE_DIR || 'public_html' }}
      - name: Check the live site
        run: |
          curl -fsS -o /dev/null -w 'site %{http_code}\n' https://www.strixproduction.com/
          curl -fsS -o /dev/null -w 'studio %{http_code}\n' https://admin.strixproduction.com/
